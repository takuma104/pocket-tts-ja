[project]
name = "pocket-tts-ja"
version = "0.1.0"
description = "Japanese fine-tuning experiments for Kyutai Pocket TTS"
requires-python = ">=3.13"
dependencies = [
    "av>=19.0.1",
    "huggingface-hub>=0.34",
    "jiwer>=4.0.0",
    "onnx>=1.23.2",
    "onnx2torch>=1.5.15",
    "onnxruntime>=1.30.0",
    "pocket-tts",
    "pyarrow>=25.0.1",
    "pyloudnorm>=0.2.0",
    "pyopenjtalk-plus>=0.4.1.post9",
    "pyworld>=0.3.5",
    "pyyaml>=6.0.3",
    "sentencepiece>=0.2.2",
    "setuptools<81",
    "silero-vad>=6.2.3",
    "soundfile>=0.14.0",
    "soxr>=1.1.0",
    "speechbrain>=1.1.1",
    "sphn>=0.2.1",
    "torchaudio>=2.11.0",
    "tqdm>=4.70.1",
    "transformers>=5.19.0",
    "wandb>=0.30.0",
]

[tool.uv.workspace]
members = [
    "third-party/pocket-tts",
]

[tool.uv.sources]
pocket-tts = { workspace = true, editable = true }

[build-system]
requires = ["uv_build>=0.10,<0.11"]
build-backend = "uv_build"
