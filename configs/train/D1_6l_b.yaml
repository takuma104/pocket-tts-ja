# D1b: the 6-layer student continued against the final teacher (step 700k, after the short-text
# stage) on mix v9. Backbone and conditioning start from the last checkpoint of D1 (raw weights;
# D1 ran against the 660k teacher until the short-text problem was found), the frozen flow and
# EOS heads are the new teacher's. Written by runs/switch_to_short.sh.
model_config: configs/model/ja_6l_4k.yaml
start_from_pretrained: false
student_init_from: runs/D1_6l/checkpoint_00042003.pt
distill_cfg_coef: 2.0
distill_teacher_config: configs/model/ja_24l_4k.yaml
distill_teacher_weights: runs/B1_4k/weights_700000.safetensors   # scripts/merge_snapshot_weights.py

data:
  train_jsonl: data/mix/B1_train_v9.jsonl
  valid_jsonl: data/emilia_ja/valid.jsonl
  max_duration_sec: 30.0
  max_voice_prompt_sec: 30.0
  prompt_trim_max_sec: 0.5
  final_punct_dropout: 0.3
  loader_procs: 3
  num_bucket_batches: 5
  precompute: false

flow:
  type: lsd
  kwargs: {}

# no CFG dropout: the teacher's targets are fully conditioned and the student never runs a
# null branch (upstream note)
text_dropout: 0.0
voice_dropout: 0.0

optim:
  lr: 4e-4
  schedule: cosine
  warmup_steps: 1000

run_dir: runs/D1_6l_b
batch_size: 64
grad_accum_steps: 1
max_steps: 120000
stats_ema_steps: 0        # keep the teacher's latent normalization
ema_decay: 0.9999
log_freq: 50
valid_freq: 2500
num_valid_batches: 50
ckpt_freq: 5000
num_ckpt_keep: 2
sample_freq: 5000
sample_cfg_coef: 1.0      # the student is sampled without CFG
sample_sentences:
  - "こんにちは. 今日はとても良い天気ですね."
  - "切手を買ってから,学校へ向かいました."
  - "この資料を,もう一度確認してください."
