# S1h: S1 60k (the 24L on the teacher's latents) continued on new teacher data in high voices (hi2,
# docs/plans/irodori_tts_distill_plan.md §9, 10/24 night). The students' harmonics fall short of the
# teacher's only in female_02 / 05, and the shortfall grows with the frame's F0 (comb 2.5-6 kHz: none
# below 250 Hz, -2 dB at 300-400 Hz, -3 to -4 dB at 400-450 Hz; S1 60k at 8 LSD steps), where the
# training data thins out (references: 99th percentile 289 Hz; hi1 280-412 Hz, median 301). A wider
# flow head (HB) gained only 0.6-1.1 dB there. hi2: voices designed by Irodori-TTS v4.1-Small from
# captions asking for a high voice (as the release voices were; scripts/teacher/design_voices.py),
# median F0 330-480 Hz, read by the teacher. Data: P3h's sets + hi1 + hi2 (hi2 rows listed twice);
# P3h's fine-tune recipe (lr 1e-4, warmup 500), 15k steps.
# Run with: uv run python scripts/train/train_student.py configs/train/S1h_hi2.yaml
ja_init_from: runs/irodori_distill/S1_24l/snapshots/step_00060000.safetensors
ja_init_full: true
ja_latent_stats: data/irodori_distill/mix/P2_s3_stats.npz  # P2's, unchanged
ja_tail_frames: 12
ja_text_aug: {multi_prob: 0.3, join_space_prob: 0.5, comma_space_prob: 0.1}
ja_context_noise: {prob: 0.5, max_std: 0.5}
model_config: configs/model/dv_24l_4k.yaml
start_from_pretrained: false

data:
  train_jsonl: data/irodori_distill/mix/S1h_all_train.jsonl  # P3h_all + hi2 (twice)
  valid_jsonl: data/irodori_distill/mix/P2_s3_valid.jsonl  # P2's
  max_duration_sec: 30.0
  max_voice_prompt_sec: 30.0
  prompt_trim_max_sec: 0.0   # the whole reference, as the teacher saw it
  final_punct_dropout: 0.3
  loader_procs: 3
  num_bucket_batches: 5
  precompute: false

flow:
  type: lsd
  kwargs: {}
flow_batch_multiplier: 4
eos_loss_weight: 0.1
text_dropout: 0.2
voice_dropout: 0.2

optim:
  lr: 1e-4
  weight_decay: 0.1
  schedule: cosine
  warmup_steps: 500

run_dir: runs/irodori_distill/S1h_hi2
batch_size: 16
grad_accum_steps: 4        # effective 64, as the 6L
max_steps: 15000
stats_ema_steps: 0         # fixed statistics (ja_latent_stats)
ema_decay: 0.999
log_freq: 50
valid_freq: 2500
num_valid_batches: 60
ckpt_freq: 5000
num_ckpt_keep: 2
sample_freq: 2500
sample_cfg_coef: 1.0
sample_sentences:
  - "こんにちは. 今日はとても良い天気ですね."
  - "切手を買ってから,学校へ向かいました."
  - "この資料を,もう一度確認してください."
