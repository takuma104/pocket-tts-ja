# B-CC tail fix, step 2: 530k -> 540k on mix v8 at the same constant 1e-4. On mix v7 (YODAS3's
# speech ends moved) the sentences with 2+ extra kana after the text went 34.4% -> 8.4% in 5k
# steps and then stayed at 10.5-11.1% to 530k (main line 1.1%); what is left is mostly a
# backchannel ("ンン", "ウン", "エエ", "ハイ"), worst on short sentences (0-15 kana: 58%). The
# kana-whisper recheck of every YODAS3 clip finds another speaker's "うん" / "えー" after the
# sentence, and short YODAS3 clips (< 15 kana) never had the extra-speech filter at all (only
# 49% pass it). Mix v8 = v7 with filter_asr_recheck.py on YODAS3 (the usual rules plus --max-tail
# 2: 2+ ASR kana after the transcript, fillers included) and --max-tail 2 on Emilia-YODAS (2.0%)
# and its gain copies. Evaluate 535k and 540k against 530k; the decay comes after.
model_config: configs/model/ja_cc_24l_4k.yaml
start_from_pretrained: true
reset_text_embedding: true

data:
  train_jsonl: data/mix/BCC_train_v8.jsonl
  valid_jsonl: data/mix/BCC_valid.jsonl
  max_duration_sec: 30.0
  max_voice_prompt_sec: 30.0   # pocket_tts_ja.loader: cap on the (prefix/full/concat) prompt
  prompt_trim_max_sec: 0.5
  final_punct_dropout: 0.3
  loader_procs: 3
  num_bucket_batches: 5
  precompute: false            # latents come precomputed

flow:
  type: lsd
  kwargs: {}

flow_batch_multiplier: 4
eos_loss_weight: 0.1
text_dropout: 0.2
voice_dropout: 0.2

optim:
  lr: 1e-4
  schedule: constant
  warmup_steps: 500

run_dir: runs/BCC_4k_tail
batch_size: 16
grad_accum_steps: 4
max_steps: 540000
stats_ema_steps: 1000
ema_decay: 0.999
log_freq: 50
valid_freq: 1000
num_valid_batches: 50
ckpt_freq: 5000
num_ckpt_keep: 2
sample_freq: 5000
sample_cfg_coef: 2.0
sample_sentences:
  - "こんにちは. 今日はとても良い天気ですね."
  - "切手を買ってから,学校へ向かいました."
  - "この資料を,もう一度確認してください."
