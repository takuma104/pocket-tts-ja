# S2h5 (plan 10/25): S2h's recipe under S1h 5k, on S1h's data without hi2's long-pause clips. S2h
# (under S1h 15k) brought female_02 / 05's harmonics near the teacher's but made female_04 and JSUT
# stall at commas (clips with a pause of 1 s or more: voices 3.5 -> 11.5%, jsut 5.7 -> 10.2%; female_04
# 13 of 20). S1h's long pauses grow with its steps (female_04: 5k 2, 10k 6, 15k 12 of 20) while its
# harmonics are as good at 5k, and hi2's teacher clips pause longer than the other sets' (a pause of
# 0.7 s or more in 15.5%, hi1 4.9%): those 2,492 clips are left out (scripts/eval/train_pauses.py).
# Run with: uv run python scripts/train/train_student.py configs/train/S2h5_s1h5k.yaml
ja_init_from: runs/irodori_distill/S2_6l/snapshots/step_00060000.safetensors
ja_latent_stats: data/irodori_distill/mix/P2_s3_stats.npz  # P2's, unchanged
ja_tail_frames: 12
ja_text_aug: {multi_prob: 0.3, join_space_prob: 0.5, comma_space_prob: 0.1}  # P3e's
ja_context_noise: {prob: 0.5, max_std: 0.5}  # P3i's
model_config: configs/model/dv_6l_4k.yaml
start_from_pretrained: false
distill_cfg_coef: 1.5
distill_teacher_config: configs/model/dv_24l_4k.yaml
distill_teacher_weights: runs/irodori_distill/S1h_hi2/snapshots/step_00005000.safetensors

data:
  train_jsonl: data/irodori_distill/mix/S1h_short_train.jsonl  # S1h's without hi2's long-pause clips
  valid_jsonl: data/irodori_distill/mix/P2_s3_valid.jsonl  # P2's
  max_duration_sec: 30.0
  max_voice_prompt_sec: 30.0
  prompt_trim_max_sec: 0.0   # the whole reference, as the teacher saw it
  final_punct_dropout: 0.3
  loader_procs: 3
  num_bucket_batches: 5
  precompute: false

flow:
  type: lsd
  kwargs: {}
flow_batch_multiplier: 4
eos_loss_weight: 0.1
# no CFG dropout: the targets are fully conditioned and the student never runs a null branch
text_dropout: 0.0
voice_dropout: 0.0

optim:
  lr: 2e-4                 # half of D1's: a continuation
  weight_decay: 0.1
  schedule: cosine
  warmup_steps: 500

run_dir: runs/irodori_distill/S2h5_s1h5k
batch_size: 16
grad_accum_steps: 4        # effective 64; at 25 Hz batch 16 peaks near 15 GB (P2a)
max_steps: 20000
stats_ema_steps: 0         # fixed statistics (ja_latent_stats)
ema_decay: 0.999
log_freq: 50
valid_freq: 2500
num_valid_batches: 60
ckpt_freq: 5000
num_ckpt_keep: 2
sample_freq: 2500
sample_cfg_coef: 1.0      # the student is sampled without CFG
sample_sentences:
  - "こんにちは. 今日はとても良い天気ですね."
  - "切手を買ってから,学校へ向かいました."
  - "この資料を,もう一度確認してください."
