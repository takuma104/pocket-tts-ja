# Head probe H0_512 (plan 10/24): a fresh flow head (configs/model/dv_6l_4k.yaml) on P3l 40k's backbone, frozen
# (ja_head_only). The comb of the female voices stays below the teacher's at any depth (S1 24L:
# +0.3-0.7 dB with the same head) and rises toward it as the frame noise shrinks, as if the
# 9.8M-parameter head blurs the next frame's choices together; a larger head should then keep
# more of the harmonics at temperature 0.7. P3l (before the CFG bake) so the evaluation is P3l
# 40k's: temperature 0.7, CFG 1.5. Data and the rest are P3l's, lr for a fresh head (S2's).
# Run with: uv run python scripts/train/train_student.py configs/train/H0_512.yaml
ja_init_from: runs/irodori_distill/P3l_6l/snapshots/step_00040000.safetensors
ja_head_only: true
model_config: configs/model/dv_6l_4k.yaml
ja_latent_stats: data/irodori_distill/mix/P2_s3_stats.npz  # P2's, unchanged
ja_tail_frames: 12
ja_text_aug: {multi_prob: 0.3, join_space_prob: 0.5, comma_space_prob: 0.1}
ja_context_noise: {prob: 0.5, max_std: 0.5}
start_from_pretrained: false

data:
  train_jsonl: data/irodori_distill/mix/P3h_all_train.jsonl  # P3b's + hi1
  valid_jsonl: data/irodori_distill/mix/P2_s3_valid.jsonl  # P2's
  max_duration_sec: 30.0
  max_voice_prompt_sec: 30.0
  prompt_trim_max_sec: 0.0   # the whole reference, as the teacher saw it
  final_punct_dropout: 0.3
  loader_procs: 3
  num_bucket_batches: 5
  precompute: false

flow:
  type: lsd
  kwargs: {}
flow_batch_multiplier: 4
eos_loss_weight: 0.1
text_dropout: 0.2
voice_dropout: 0.2

optim:
  lr: 4e-4
  weight_decay: 0.1
  schedule: cosine
  warmup_steps: 1000

run_dir: runs/irodori_distill/H0_512
batch_size: 16
grad_accum_steps: 4        # effective 64; at 25 Hz batch 16 peaks near 15 GB (P2a)
max_steps: 20000
stats_ema_steps: 0         # fixed statistics (ja_latent_stats)
ema_decay: 0.999
log_freq: 50
valid_freq: 2500
num_valid_batches: 60
ckpt_freq: 5000
num_ckpt_keep: 2
sample_freq: 2500
sample_cfg_coef: 1.0
sample_sentences:
  - "こんにちは. 今日はとても良い天気ですね."
  - "切手を買ってから,学校へ向かいました."
  - "この資料を,もう一度確認してください."
