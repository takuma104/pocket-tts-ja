# S1nl_pf: S1nl 10k continued 3k steps on S1nl_all without the rows whose teacher latent pauses 0.8 s or more
# (scripts/train/latent_pauses.py: 2-4% of most sets, 11-13% of num and latin), against S1nl_ctl (the
# same on S1nl_all). female_04 pauses longer with every S1 fine-tune (median 0.58 s at S1_60k, 1.26 at
# S1nl, the teacher 0.40): is it the long pauses in the data the fine-tunes add?
# Run with: uv run python scripts/train/train_student.py configs/train/S1nl_pf.yaml
ja_init_from: runs/irodori_distill/S1nl/snapshots/step_00010000.safetensors
ja_init_full: true
ja_latent_stats: data/irodori_distill/mix/P2_s3_stats.npz  # P2's, unchanged
ja_tail_frames: 12
ja_text_aug: {multi_prob: 0.3, join_space_prob: 0.5, comma_space_prob: 0.1}
ja_context_noise: {prob: 0.5, max_std: 0.5}
model_config: configs/model/dv_24l_4k.yaml
start_from_pretrained: false

data:
  train_jsonl: data/irodori_distill/mix/S1nlf_all_train.jsonl
  valid_jsonl: data/irodori_distill/mix/P2_s3_valid.jsonl  # P2's
  max_duration_sec: 30.0
  max_voice_prompt_sec: 30.0
  prompt_trim_max_sec: 0.0   # the whole reference, as the teacher saw it
  final_punct_dropout: 0.3
  loader_procs: 3
  num_bucket_batches: 5
  precompute: false

flow:
  type: lsd
  kwargs: {}
flow_batch_multiplier: 4
eos_loss_weight: 0.1
text_dropout: 0.2
voice_dropout: 0.2

optim:
  lr: 1e-4
  weight_decay: 0.1
  schedule: cosine
  warmup_steps: 200

run_dir: runs/irodori_distill/S1nl_pf
batch_size: 16
grad_accum_steps: 4        # effective 64, as the 6L
max_steps: 3000
stats_ema_steps: 0         # fixed statistics (ja_latent_stats)
ema_decay: 0.999
log_freq: 50
valid_freq: 3000
num_valid_batches: 60
ckpt_freq: 3000
num_ckpt_keep: 2
sample_freq: 3000
sample_cfg_coef: 1.0
sample_sentences:
  - "こんにちは. 今日はとても良い天気ですね."
  - "切手を買ってから,学校へ向かいました."
  - "この資料を,もう一度確認してください."
  - "山間部では,雪が50センチ以上降った."
  - "USBケーブルでiPhoneをPCにつなぎます."
