# B-CC decay on mix v8: 540k -> 600k, cosine from the constant 1e-4 of the tail runs down to 0
# (warmup_steps = the start step, so the schedule starts at its peak: lr_at() is a function of the
# absolute step). The first decay (configs/train/BCC_4k_decay.yaml, 400k -> 500k on mix v6) left
# the readings where they were and brought the trailing extra speech up from YODAS3's clip ends;
# this one runs on the mix with YODAS3's ends moved (v7) and its backchannel tails removed (v8).
# Evaluate 560k, 580k, 600k; the teacher for D0-CC / D1-CC is picked from them.
model_config: configs/model/ja_cc_24l_4k.yaml
start_from_pretrained: true
reset_text_embedding: true

data:
  train_jsonl: data/mix/BCC_train_v8.jsonl
  valid_jsonl: data/mix/BCC_valid.jsonl
  max_duration_sec: 30.0
  max_voice_prompt_sec: 30.0   # pocket_tts_ja.loader: cap on the (prefix/full/concat) prompt
  prompt_trim_max_sec: 0.5
  final_punct_dropout: 0.3
  loader_procs: 3
  num_bucket_batches: 5
  precompute: false            # latents come precomputed

flow:
  type: lsd
  kwargs: {}

flow_batch_multiplier: 4
eos_loss_weight: 0.1
text_dropout: 0.2
voice_dropout: 0.2

optim:
  lr: 1e-4
  schedule: cosine
  warmup_steps: 540000

run_dir: runs/BCC_4k_tail
batch_size: 16
grad_accum_steps: 4
max_steps: 600000
stats_ema_steps: 1000
ema_decay: 0.999
log_freq: 50
valid_freq: 1000
num_valid_batches: 50
ckpt_freq: 5000
num_ckpt_keep: 2
sample_freq: 5000
sample_cfg_coef: 2.0
sample_sentences:
  - "こんにちは. 今日はとても良い天気ですね."
  - "切手を買ってから,学校へ向かいました."
  - "この資料を,もう一度確認してください."
