# P3c: P3h (P3b 60k + hi1, 20k steps) with noise on the past latents (docs/plans/
# irodori_tts_distill_plan.md, P3c and 10/23). At temperature 0.7 the students still fall into
# pauses of 1 s or more that the teacher never makes (P3h 20k on jsut: 13.5% of the clips, jvs006
# 34%, teacher 0.4%; the teacher's training clips 0-5%, shortening the prompt's own pauses does not
# help), and more of them at lower temperatures: a generation that drifts off the teacher's
# latents. Half the rows see their past with Gaussian noise of a per-row std in [0, 0.5]
# (normalized units), the flow targets stay clean (pocket_tts_ja.post_eos.ContextNoise).
# Everything else is P3h's (runs/irodori_distill/P3h_6l_from_P3b.yaml), so the two compare directly.
# Run with: uv run python scripts/train/train_student.py configs/train/P3c_6l.yaml
ja_init_from: runs/irodori_distill/P3b_6l/snapshots/step_00060000.safetensors
ja_init_full: true
ja_latent_stats: data/irodori_distill/mix/P2_s3_stats.npz  # P2's, unchanged
ja_tail_frames: 12
ja_context_noise: {prob: 0.5, max_std: 0.5}
model_config: configs/model/dv_6l_4k.yaml
start_from_pretrained: false

data:
  train_jsonl: data/irodori_distill/mix/P3h_all_train.jsonl  # P3b's + hi1
  valid_jsonl: data/irodori_distill/mix/P2_s3_valid.jsonl  # P2's
  max_duration_sec: 30.0
  max_voice_prompt_sec: 30.0
  prompt_trim_max_sec: 0.0   # the whole reference, as the teacher saw it
  final_punct_dropout: 0.3
  loader_procs: 3
  num_bucket_batches: 5
  precompute: false

flow:
  type: lsd
  kwargs: {}
flow_batch_multiplier: 4
eos_loss_weight: 0.1
text_dropout: 0.2
voice_dropout: 0.2

optim:
  lr: 1e-4
  weight_decay: 0.1
  schedule: cosine
  warmup_steps: 500

run_dir: runs/irodori_distill/P3c_6l
batch_size: 16
grad_accum_steps: 4        # effective 64; at 25 Hz batch 16 peaks near 15 GB (P2a)
max_steps: 20000
stats_ema_steps: 0         # fixed statistics (ja_latent_stats)
ema_decay: 0.999
log_freq: 50
valid_freq: 2500
num_valid_batches: 60
ckpt_freq: 5000
num_ckpt_keep: 2
sample_freq: 2500
sample_cfg_coef: 1.0
sample_sentences:
  - "こんにちは. 今日はとても良い天気ですね."
  - "切手を買ってから,学校へ向かいました."
  - "この資料を,もう一度確認してください."
