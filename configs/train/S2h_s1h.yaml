# S2h (plan 10/25): S2 60k, the 6L, continued under S1h (S1 60k + 15k steps on hi2's high voices,
# which closed ~40% of female_02 / 05's harmonic gap to the teacher at 8 steps) as the new teacher:
# S2's recipe (CFG 1.5 baked) on S1h's data, the backbone from S2 60k, the frozen heads S1h's.
# 20k steps: S2 from scratch was nearly flat after 40k.
# Run with: uv run python scripts/train/train_student.py configs/train/S2h_s1h.yaml
ja_init_from: runs/irodori_distill/S2_6l/snapshots/step_00060000.safetensors
ja_latent_stats: data/irodori_distill/mix/P2_s3_stats.npz  # P2's, unchanged
ja_tail_frames: 12
ja_text_aug: {multi_prob: 0.3, join_space_prob: 0.5, comma_space_prob: 0.1}  # P3e's
ja_context_noise: {prob: 0.5, max_std: 0.5}  # P3i's
model_config: configs/model/dv_6l_4k.yaml
start_from_pretrained: false
distill_cfg_coef: 1.5
distill_teacher_config: configs/model/dv_24l_4k.yaml
distill_teacher_weights: runs/irodori_distill/S1h_hi2/snapshots/step_00015000.safetensors

data:
  train_jsonl: data/irodori_distill/mix/S1h_all_train.jsonl  # S1h's: P3h's + hi2 twice
  valid_jsonl: data/irodori_distill/mix/P2_s3_valid.jsonl  # P2's
  max_duration_sec: 30.0
  max_voice_prompt_sec: 30.0
  prompt_trim_max_sec: 0.0   # the whole reference, as the teacher saw it
  final_punct_dropout: 0.3
  loader_procs: 3
  num_bucket_batches: 5
  precompute: false

flow:
  type: lsd
  kwargs: {}
flow_batch_multiplier: 4
eos_loss_weight: 0.1
# no CFG dropout: the targets are fully conditioned and the student never runs a null branch
text_dropout: 0.0
voice_dropout: 0.0

optim:
  lr: 2e-4                 # half of D1's: a continuation
  weight_decay: 0.1
  schedule: cosine
  warmup_steps: 500

run_dir: runs/irodori_distill/S2h_s1h
batch_size: 16
grad_accum_steps: 4        # effective 64; at 25 Hz batch 16 peaks near 15 GB (P2a)
max_steps: 20000
stats_ema_steps: 0         # fixed statistics (ja_latent_stats)
ema_decay: 0.999
log_freq: 50
valid_freq: 2500
num_valid_batches: 60
ckpt_freq: 5000
num_ckpt_keep: 2
sample_freq: 2500
sample_cfg_coef: 1.0      # the student is sampled without CFG
sample_sentences:
  - "こんにちは. 今日はとても良い天気ですね."
  - "切手を買ってから,学校へ向かいました."
  - "この資料を,もう一度確認してください."
