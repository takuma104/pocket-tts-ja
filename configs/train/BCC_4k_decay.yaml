# B-CC teacher, final LR decay (the user's decision of 10/14 22:00: start it at 400k instead of
# 600k; JKYB-mini sat at 92.1% +- 0.5 over 140k-295k at the constant LR and jvs_bal did not go
# down, while the main line's decay 600k -> 660k improved JSUT 2.86 -> 2.40% and Aozora 65.0 ->
# 69.6%). Resumes runs/BCC_4k at 400k (raw weights, optimizer state and EMA of the checkpoint) on
# mix v6 and brings the LR from 2e-4 to 0 at 500k: the 100k steps of the main line's decay plus
# short stage in one cosine. The main line needed the second cosine only because S9 arrived after
# its decay (its restart from 0 to 2e-4 cost some points for a few thousand steps); mix v6 has had
# S9 at 1% of the hours all along, so there is no separate short stage here. The trainer's cosine
# is a function of the absolute step, lr(s) = lr/2 * (1 + cos(pi * (s - warmup) / (max - warmup))),
# so lr 4e-4 with warmup 300k and max 500k puts the resume point at the middle of the cosine:
# 2e-4 at 400k, 1.2e-4 at 425k, 5.9e-5 at 450k, 1.5e-5 at 475k, 0 at 500k (no warm-up: step > 300k).
# Takes runs/BCC_4k over through runs/BCC_4k/next_config, written by runs/bcc_decay_handover.sh
# after the 395k checkpoint.
model_config: configs/model/ja_cc_24l_4k.yaml
start_from_pretrained: true
reset_text_embedding: true

data:
  train_jsonl: data/mix/BCC_train_v6.jsonl
  valid_jsonl: data/mix/BCC_valid.jsonl
  max_duration_sec: 30.0
  max_voice_prompt_sec: 30.0   # pocket_tts_ja.loader: cap on the (prefix/full/concat) prompt
  prompt_trim_max_sec: 0.5
  final_punct_dropout: 0.3
  loader_procs: 3
  num_bucket_batches: 5
  precompute: false            # latents come precomputed

flow:
  type: lsd
  kwargs: {}

flow_batch_multiplier: 4
eos_loss_weight: 0.1
text_dropout: 0.2
voice_dropout: 0.2

optim:
  lr: 4e-4
  schedule: cosine
  warmup_steps: 300000

run_dir: runs/BCC_4k
batch_size: 16
grad_accum_steps: 4
max_steps: 500000
stats_ema_steps: 1000
ema_decay: 0.999
log_freq: 50
valid_freq: 1000
num_valid_batches: 50
ckpt_freq: 5000
num_ckpt_keep: 2
sample_freq: 5000
sample_cfg_coef: 2.0
sample_sentences:
  - "こんにちは. 今日はとても良い天気ですね."
  - "切手を買ってから,学校へ向かいました."
  - "この資料を,もう一度確認してください."
