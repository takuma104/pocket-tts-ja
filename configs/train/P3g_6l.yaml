# P3g: P3b with varied training prompts (docs/plans/irodori_tts_distill_plan.md, P3g). P2 failed on
# the JVS prompts of the evaluation (~5 s, 0.5 s of silence at each end) unless they were made
# 13-17 s long: every training prompt was the one 5-12 s tightly trimmed reference of its voice.
# Here half the prompts are another teacher output of the same voice, half are cropped to 2 s or
# more, half get 0-0.6 s of silence latent before and after (pocket_tts_ja.dv_loader.PromptAug).
# Everything else is P3b's (data, warm start, steps, statistics, validation rows with the
# references), so the two compare directly.
# Run with: uv run python scripts/train/train_student.py configs/train/P3g_6l.yaml
ja_init_from: runs/D1_cc_6l/snapshots/step_00160000.safetensors
ja_latent_stats: data/irodori_distill/mix/P2_s3_stats.npz  # P2's, unchanged
ja_tail_frames: 12
ja_prompt_aug: {other_prob: 0.5, crop_prob: 0.5, crop_min_sec: 2.0, pad_prob: 0.5, pad_max_sec: 0.6}
model_config: configs/model/dv_6l_4k.yaml
start_from_pretrained: false

data:
  train_jsonl: data/irodori_distill/mix/P3b_all_train.jsonl
  valid_jsonl: data/irodori_distill/mix/P2_s3_valid.jsonl  # P2's
  max_duration_sec: 30.0
  max_voice_prompt_sec: 30.0
  prompt_trim_max_sec: 0.0   # the whole reference, as the teacher saw it
  final_punct_dropout: 0.3
  loader_procs: 3
  num_bucket_batches: 5
  precompute: false

flow:
  type: lsd
  kwargs: {}
flow_batch_multiplier: 4
eos_loss_weight: 0.1
text_dropout: 0.2
voice_dropout: 0.2

optim:
  lr: 2e-4
  weight_decay: 0.1
  schedule: cosine
  warmup_steps: 1000

run_dir: runs/irodori_distill/P3g_6l
batch_size: 16
grad_accum_steps: 4        # effective 64; at 25 Hz batch 16 peaks near 15 GB (P2a)
max_steps: 60000
stats_ema_steps: 0         # fixed statistics (ja_latent_stats)
ema_decay: 0.999
log_freq: 50
valid_freq: 2500
num_valid_batches: 60
ckpt_freq: 5000
num_ckpt_keep: 2
sample_freq: 2500
sample_cfg_coef: 1.0
sample_sentences:
  - "こんにちは. 今日はとても良い天気ですね."
  - "切手を買ってから,学校へ向かいました."
  - "この資料を,もう一度確認してください."
