# P3h: the better of P3b / P3g at 60k, trained on with the hi1 voices added (docs/plans/
# irodori_tts_distill_plan.md, 10/23). female_02 / 05 (351 / 374 Hz) sound doubled: they lie above
# every training reference (99th percentile 289 Hz), and no sampling setting brings their
# harmonics back. hi1 is the teacher in 270 new Emilia-YODAS voices at 280-412 Hz (scripts/teacher/
# high_f0_refs.py; 21,600 rows before QC), added to P3b's data (about 7% of the rows). The whole
# student is loaded (ja_init_full) and trained 20k more steps at half P3b's learning rate. This
# file continues P3g (its prompt variation kept); runs/irodori_distill/p3h_start.sh writes the
# P3b variant if P3b was better.
# Run with: uv run python scripts/train/train_student.py configs/train/P3h_6l.yaml
ja_init_from: runs/irodori_distill/P3g_6l/snapshots/step_00060000.safetensors
ja_init_full: true
ja_latent_stats: data/irodori_distill/mix/P2_s3_stats.npz  # P2's, unchanged
ja_tail_frames: 12
ja_prompt_aug: {other_prob: 0.5, crop_prob: 0.5, crop_min_sec: 2.0, pad_prob: 0.5, pad_max_sec: 0.6}
model_config: configs/model/dv_6l_4k.yaml
start_from_pretrained: false

data:
  train_jsonl: data/irodori_distill/mix/P3h_all_train.jsonl  # P3b's + hi1
  valid_jsonl: data/irodori_distill/mix/P2_s3_valid.jsonl  # P2's
  max_duration_sec: 30.0
  max_voice_prompt_sec: 30.0
  prompt_trim_max_sec: 0.0   # the whole reference, as the teacher saw it
  final_punct_dropout: 0.3
  loader_procs: 3
  num_bucket_batches: 5
  precompute: false

flow:
  type: lsd
  kwargs: {}
flow_batch_multiplier: 4
eos_loss_weight: 0.1
text_dropout: 0.2
voice_dropout: 0.2

optim:
  lr: 1e-4
  weight_decay: 0.1
  schedule: cosine
  warmup_steps: 500

run_dir: runs/irodori_distill/P3h_6l
batch_size: 16
grad_accum_steps: 4        # effective 64; at 25 Hz batch 16 peaks near 15 GB (P2a)
max_steps: 20000
stats_ema_steps: 0         # fixed statistics (ja_latent_stats)
ema_decay: 0.999
log_freq: 50
valid_freq: 2500
num_valid_batches: 60
ckpt_freq: 5000
num_ckpt_keep: 2
sample_freq: 2500
sample_cfg_coef: 1.0
sample_sentences:
  - "こんにちは. 今日はとても良い天気ですね."
  - "切手を買ってから,学校へ向かいました."
  - "この資料を,もう一度確認してください."
