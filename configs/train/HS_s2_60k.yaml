# HS_s2_60k (plan 10/24): HS_s2_20k's recipe on S2 60k, the final 6L: S1 60k's flow head (frozen in S2)
# learns in one LSD step what it makes in eight from the same noise (temperature 0.7), on S2 60k's
# frozen backbone. On S2 20k, 10k steps gave most of the 8 steps' gain at 1 step (female NISQA-TTS
# 4.072 vs 4.078 / 1 step 4.021; female_02 / 05 comb 7.3 / 8.9) with the validation loss still
# falling (0.0026), so 20k steps here.
# Run with: uv run python scripts/train/train_student.py configs/train/HS_s2_60k.yaml
ja_init_from: runs/irodori_distill/S2_6l/snapshots/step_00060000.safetensors
ja_head_steps: 8
head_distill_temp: 0.7
ja_latent_stats: data/irodori_distill/mix/P2_s3_stats.npz  # P2's, unchanged
ja_tail_frames: 12
ja_text_aug: {multi_prob: 0.3, join_space_prob: 0.5, comma_space_prob: 0.1}  # P3e's
ja_context_noise: {prob: 0.5, max_std: 0.5}  # P3i's
model_config: configs/model/dv_6l_4k.yaml
start_from_pretrained: false

data:
  train_jsonl: data/irodori_distill/mix/P3h_all_train.jsonl  # P3b's + hi1
  valid_jsonl: data/irodori_distill/mix/P2_s3_valid.jsonl  # P2's
  max_duration_sec: 30.0
  max_voice_prompt_sec: 30.0
  prompt_trim_max_sec: 0.0   # the whole reference, as the teacher saw it
  final_punct_dropout: 0.3
  loader_procs: 3
  num_bucket_batches: 5
  precompute: false

flow:
  type: lsd
  kwargs: {}
flow_batch_multiplier: 4
eos_loss_weight: 0.1
text_dropout: 0.0
voice_dropout: 0.0

optim:
  lr: 1e-4                 # a fine-tune of a trained head
  weight_decay: 0.1
  schedule: cosine
  warmup_steps: 500

run_dir: runs/irodori_distill/HS_s2_60k
batch_size: 16
grad_accum_steps: 4        # effective 64; at 25 Hz batch 16 peaks near 15 GB (P2a)
max_steps: 20000
stats_ema_steps: 0         # fixed statistics (ja_latent_stats)
ema_decay: 0.999
log_freq: 50
valid_freq: 2500
num_valid_batches: 60
ckpt_freq: 5000
num_ckpt_keep: 2
sample_freq: 2500
sample_cfg_coef: 1.0      # the student is sampled without CFG
sample_sentences:
  - "こんにちは. 今日はとても良い天気ですね."
  - "切手を買ってから,学校へ向かいました."
  - "この資料を,もう一度確認してください."
